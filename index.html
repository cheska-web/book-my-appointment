document.getElementById('postcodeInput').addEventListener('input', function() {
  const input = this.value.trim().toLowerCase();
  const resultsDiv = document.getElementById('clinicResults');
  resultsDiv.innerHTML = '';

  if (input.length < 2) return;

  const matches = clinics.filter(c =>
    c.postcode.toLowerCase().includes(input) ||
    c.name.toLowerCase().includes(input)
  );

  if (matches.length === 0) {
    resultsDiv.innerHTML = "<p style='color:#37061c;'>No clinics found. Try another search term.</p>";
    return;
  }

  matches.forEach((clinic, index) => {
    const encoded = encodeURIComponent(`${clinic.name}, ${clinic.address}, ${clinic.postcode}`);
    const card = `
      <div style="border:1px solid #ed87bf;border-radius:10px;padding:15px;margin:10px 0;text-align:left;">
        <h3 style="margin:0;color:#e5007e;">${clinic.name}</h3>
        <p style="margin:5px 0;"><strong>Address:</strong> ${clinic.address}</p>
        <p style="margin:5px 0;"><strong>Postcode:</strong> ${clinic.postcode}</p>
        <p style="margin:5px 0;"><strong>Phone:</strong> <a href="tel:${clinic.phone}" style="color:#e5007e;">${clinic.phone}</a></p>
        <p style="margin:5px 0;"><strong>Email:</strong> <a href="mailto:${clinic.email}" style="color:#e5007e;">${clinic.email}</a></p>
        <button onclick="openMap('${encoded}')"
                style="margin-top:8px;padding:8px 16px;background:#e5007e;color:#fff;border:none;border-radius:6px;cursor:pointer;">
          🌍 Open in Google Maps
        </button>
        <button onclick="openBooking('${clinic.name}')"
                style="margin-top:8px;margin-left:8px;padding:8px 16px;background:#37061c;color:#fff;border:none;border-radius:6px;cursor:pointer;">
          📅 Book Now
        </button>
      </div>`;
    resultsDiv.innerHTML += card;
  });
});

function openMap(encodedQuery) {
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
  window.open(mapUrl, '_blank', 'noopener');
}

function openBooking(clinicName) {
  const modal = document.getElementById('bookingModal');
  const formContainer = document.getElementById('form-container');

  // Clear any previous form
  formContainer.innerHTML = '';

  // Dynamically create the iframe
  const iframe = document.createElement('iframe');
  const baseUrl = "https://link.deliveringdemand.com/widget/form/aWk6rAzrmt2jQr1XJzTx";
  const url = new URL(baseUrl);
  url.searchParams.set('clinic_name', clinicName);

  iframe.src = url.toString();
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.style.borderRadius = "10px";
  iframe.id = "inline-aWk6rAzrmt2jQr1XJzTx";
  iframe.dataset.layout = "{'id':'INLINE'}";
  iframe.dataset.triggerType = "alwaysShow";
  iframe.dataset.activationType = "alwaysActivated";
  iframe.dataset.deactivationType = "neverDeactivate";
  iframe.dataset.formName = "WOW Fusion";
  iframe.dataset.height = "491";
  iframe.dataset.layoutIframeId = "inline-aWk6rAzrmt2jQr1XJzTx";
  iframe.dataset.formId = "aWk6rAzrmt2jQr1XJzTx";
  iframe.title = "WOW Fusion";

  formContainer.appendChild(iframe);

  // Dynamically load the GHL embed script
  const script = document.createElement('script');
  // Add a timestamp to the script URL to ensure it re-executes every time
  script.src = "https://link.deliveringdemand.com/js/form_embed.js?ts=" + new Date().getTime();
  script.id = "ghl-embed-script";
  formContainer.appendChild(script);

  modal.style.display = 'block';
}

function closeModal() {
  const modal = document.getElementById('bookingModal');
  const formContainer = document.getElementById('form-container');
  const script = document.getElementById('ghl-embed-script');

  modal.style.display = 'none';

  // Clean up the form and script to ensure a fresh load next time
  formContainer.innerHTML = '';
  if (script) {
    script.remove();
  }
}
