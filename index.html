    <style>
        /* Minimal styling for the card layout (adjust to taste) */
        /* Using Tailwind for structure where possible, but keeping custom styles for aesthetics */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            background-color: #f7f7f7;
        }

        .clinic-finder-wrap {
            max-width:880px;
            margin:18px auto;
            font-family:Poppins,system-ui,Segoe UI,Roboto,Arial;
            text-align:center;
            padding: 0 16px;
        }

        .cf-input {
            width:100%;
            max-width:640px;
            margin:0 auto;
            display:block;
            padding:14px 18px;
            font-size:18px;
            border-radius:12px;
            border:2px solid transparent;
            border-image:linear-gradient(90deg,#d4af37,#f5e99f) 1;
            background:#fff;
            color:#000;
            box-sizing:border-box;
            transition: box-shadow 0.3s ease;
        }
        .cf-input:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.5);
        }

        .cf-results { margin-top:24px; text-align:left; }

        .cf-card {
            display:flex;
            gap:16px;
            align-items:flex-start;
            justify-content:space-between;
            background:linear-gradient(145deg,#ffffff,#fffcf0);
            border-radius:16px; /* Keep existing border-radius for rounded corners */
            padding:20px;
            /* Removed the border-image for sharp edges */
            border: 1px solid #e2e8f0; /* New, softer border */
            box-shadow:0 8px 24px rgba(0,0,0,0.05); /* Soften shadow color */
            margin-bottom:16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cf-card:hover {
            transform: translateY(-2px);
            box-shadow:0 10px 30px rgba(0,0,0,0.1); /* Soften hover shadow color */
        }

        .cf-left { flex:1; }
        .cf-name { font-weight:700; color:#1a202c; font-size:20px; margin-bottom:4px; }
        .cf-address { color:#4a5568; font-size:15px; margin-bottom:8px; line-height:1.4; }
        .cf-meta { color:#718096; font-size:14px; margin-top:8px; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
        .cf-actions { display:flex; flex-direction:column; gap:10px; min-width:140px; text-align: right; }

        .cf-btn {
            padding:10px 14px;
            border-radius:10px;
            border:1px solid #d4af37;
            background:#fff;
            cursor:pointer;
            font-weight:600;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .cf-btn.primary {
            background:#ff4d6e;
            color:#fff;
            border-color:transparent;
            box-shadow: 0 4px 10px rgba(255, 77, 110, 0.4);
        }
        .cf-btn.primary:hover {
            background:#e63946;
            box-shadow: 0 6px 15px rgba(230, 57, 70, 0.6);
        }

        .cf-heading {
            font-size:24px;
            color:#333;
            margin:16px 0;
            font-weight:700;
            border-bottom: 2px solid #f9d423;
            padding-bottom: 8px;
            text-align: center;
        }
        .cf-small { font-size:14px; color:#555; margin-bottom: 4px; }

        /* Loading/Error Messages */
        #cf-loading { color:#444; font-size:14px; margin-top:16px; font-style: italic; }
        #clinicResults p { padding: 10px 0; }

        @media (max-width:640px) {
            .cf-card { flex-direction:column; }
            .cf-actions { flex-direction:row; justify-content:space-between; min-width: 100%; text-align: center; }
            .cf-btn { flex: 1; }
        }

        /* --- NEW MODAL STYLES --- */
        #booking-modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6); /* Dark semi-transparent background */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto; /* 5% from the top and centered */
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px; /* Adjust max width for the form */
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            transition: color 0.3s;
        }
        .close-btn:hover,
        .close-btn:focus {
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }
        #modal-headline {
            font-size: 22px;
            font-weight: 700;
            color: #ff4d6e; /* Using primary button color for emphasis */
            margin: 0 0 15px 0;
            text-align: center;
        }
        /* Make sure the iframe is responsive and has a set height */
        #inline-aWk6rAzrmt2jQr1XJzTx {

        normalizedPostcode: c.postcode.trim().toUpperCase().replace(/\s+/g,''),
        geocoded: !!(c.lat && c.lon),
        distanceMiles: Infinity
    }));

    function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const toRad = deg => deg * Math.PI/180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
    function kmToMiles(km){ return km * 0.621371; }

    function escapeHtml(str) {
        if (typeof str !== 'string') return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Function to open the modal and set the dynamic content
    function openBookingModal(clinic) {
        const clinicName = clinic.name;
        modalHeadline.textContent = `Book an Appointment with ${clinicName}`;

        // 1. Construct the new URL with the 'clinic' parameter AND a cache-busting timestamp
        const formBaseUrl = 'https://link.deliveringdemand.com/widget/form/aWk6rAzrmt2jQr1XJzTx';
        const params = new URLSearchParams();
        params.append('clinic', clinicName);
        // Add a timestamp to prevent iframe caching issues
        const newIframeSrc = `${formBaseUrl}?${params.toString()}&timestamp=${new Date().getTime()}`;

        // 2. Set the new source for the iframe
        formIframe.src = newIframeSrc;

        // 3. Force the GHL form embed script to re-initialize to capture the new clinic name
        const embedScriptUrl = 'https://link.deliveringdemand.com/js/form_embed.js';
        const modalContent = document.querySelector('.modal-content');

        // Remove the old script tag to ensure a clean re-execution
        const oldScript = modalContent.querySelector(`script[src="${embedScriptUrl}"]`);
        if (oldScript) {
            oldScript.remove();
        }

        // Create a new script tag and append it to force the browser to re-download and execute
        const newScript = document.createElement('script');
        newScript.src = embedScriptUrl;
        modalContent.appendChild(newScript);

        // 4. Display the modal
        modal.style.display = 'block';
    }
    // Function to close the modal
    function closeBookingModal() {
        modal.style.display = 'none';
    }

    // Set up listeners to close the modal (must be inside the script block)
    if (closeBtn) closeBtn.onclick = closeBookingModal;
    window.onclick = function(event) {
        if (event.target === modal) {
            closeBookingModal();
        }
    }

    function _openBookingCalendar(clinic) {

        const clinicString = JSON.stringify(clinic);

        // Deserialize the clinic object for use
        const c = JSON.parse(clinicString);

        const calendarUrl = `${GHL_CALENDAR_BASE_URL}?_clientEmail=${encodeURIComponent(c.email)}`

                            + `&clinic=${encodeURIComponent(c.name)}`
                            + `&_source=ClinicFinder`;

        // Open the calendar in a new tab
        window.open(calendarUrl, '_blank');
    }

    function renderResults(clinics) {
        resultsDiv.innerHTML = '';
        if (clinics.length === 0) {
            resultsDiv.innerHTML = '<p class="cf-heading">No clinics found nearby or matching your search.</p>';
            return;
        }

        // Sort by distance (Infinity distances will be last)
        clinics.sort((a,b) => {
            if (a.distanceMiles === Infinity && b.distanceMiles === Infinity) return 0;
            if (a.distanceMiles === Infinity) return 1;
            if (b.distanceMiles === Infinity) return -1;
            return a.distanceMiles - b.distanceMiles;
        });

        resultsDiv.innerHTML = '<p class="cf-heading">Nearest Clinics</p>' + clinics.map(generateClinicCard).join('');
    }

    let lastTimeout = null;
    inputEl.addEventListener('input', function() {
        const query = this.value.trim();
        clearTimeout(lastTimeout);
        // Only run search if query is long enough (prevents showing all clinics on initial load)
        if (query.length > 1) {
            lastTimeout = setTimeout(() => handleSearch(query), 250);
        } else {
            // Clear results if the search box is empty
            resultsDiv.innerHTML = '';
            loadingEl.style.display = 'none';
        }
    });

    // Add event listener for Enter key to search immediately
    inputEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const query = this.value.trim();
            clearTimeout(lastTimeout);
            handleSearch(query);
        }
    });

    // Function to handle the search logic
    async function handleSearch(query) {
        loadingEl.style.display = 'block';
        resultsDiv.innerHTML = '';

        // Normalize the user's query for comparison and API search
        const normalizedQuery = query.trim().toUpperCase().replace(/\s+/g,'');

        // Don't search if query is too short (unless it's something like "B2")
        // This check is duplicated here just in case 'keypress' skips the 'input' check
        if (!normalizedQuery || (normalizedQuery.length < 2 && normalizedQuery.length !== 1)) {
            loadingEl.style.display = 'none';
            return;
        }

        let userLoc = null;
        // Determine the outward code part (first part of postcode, used for outcode geocoding)
        const queryOutwardCode = query.trim().toUpperCase().split(' ')[0];


        // 1. Geocode the user's location via API
        try {
            // Try full postcode search
            let resp = await fetch(`${POSTCODES_API_BASE}/postcodes/${encodeURIComponent(normalizedQuery)}`);
            if (resp.ok) {
                const json = await resp.json();
                if (json && json.result) userLoc = { lat: json.result.latitude, lon: json.result.longitude };
            }

            // If full postcode fails, try outcode search (using the queryOutwardCode)
            if (!userLoc && queryOutwardCode.length > 1) {
                const outResp = await fetch(`${POSTCODES_API_BASE}/outcodes/${encodeURIComponent(queryOutwardCode)}`);
                if (outResp.ok) {
                    const outJson = await outResp.json();
                    // Use the average of the outcode
                    if (outJson && outJson.result) userLoc = { lat: outJson.result.latitude, lon: outJson.result.longitude };
                }
            }
        } catch(err) {
            console.warn('Error geocoding user location', err);
            // Continue if geocoding fails, fallback to name/address search
        }


        // 2. Process Clinics: Calculate distance if user location is known
        let filteredClinics = clinicObjects.map(c => {
            let distanceKm = Infinity;
            let distanceMiles = Infinity;

            // CRITICAL FIX: If the normalized postcodes are an exact match, set distance to 0 immediately.
            if (c.normalizedPostcode === normalizedQuery) {
                distanceMiles = 0;
            } else if (userLoc && c.geocoded) {
                // Otherwise, calculate distance using the coordinates obtained from the API
                distanceKm = haversineKm(userLoc.lat, userLoc.lon, c.lat, c.lon);
                distanceMiles = kmToMiles(distanceKm);
            }

            return {
                ...c,
                distanceMiles: distanceMiles
            };
        });

        // 3. Apply final filtering
        if (!userLoc) {
             // If geocoding failed (i.e., query was a name, city, or invalid code), fall back to text search
            const searchLower = query.toLowerCase();
            filteredClinics = filteredClinics.filter(c =>
                c.name.toLowerCase().includes(searchLower) ||
                c.address.toLowerCase().includes(searchLower) ||
                c.postcode.toLowerCase().includes(searchLower)
            ).map(c => ({...c, distanceMiles: Infinity})); // Set distance back to Infinity for text-only matches
        } else {
            // If geocoding succeeded, filter out clinics with unknown coordinates (distanceMiles === Infinity)
            filteredClinics = filteredClinics.filter(c => c.distanceMiles !== Infinity);
        }

        loadingEl.style.display = 'none';
        renderResults(filteredClinics);
    }
</script>
</body>
</html>
