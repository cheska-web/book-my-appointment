<style>
  /* Minimal styling for the card layout (adjust to taste) */
  .clinic-finder-wrap {
    max-width:880px;
    margin:18px auto;
    font-family:Poppins,system-ui,Segoe UI,Roboto,Arial;
    text-align:center; /* ✅ Center contents inside GHL element */
  }

  .cf-input {
    width:100%;
    max-width:640px;
    margin:0 auto; /* ✅ Center input box horizontally */
    display:block;
    padding:12px 14px;
    font-size:16px;
    border-radius:10px;
    border:2px solid transparent;
    border-image:linear-gradient(90deg,#d4af37,#f5e99f) 1;
    background:#fff;
    color:#000;
    box-sizing:border-box;
  }

  .cf-results { margin-top:18px; text-align:left; }
  .cf-card { display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
              background:linear-gradient(145deg,#fffaf0,#fff8e1); border-radius:12px; padding:14px;
              border:2px solid transparent; border-image:linear-gradient(90deg,#f9d423,#d4af37) 1;
              box-shadow:0 6px 18px rgba(212,175,55,0.08); margin-bottom:12px; }
  .cf-left { flex:1; }
  .cf-name { font-weight:700; color:#0b1220; font-size:16px; margin-bottom:6px; }
  .cf-address { color:#2b2b2b; font-size:14px; margin-bottom:6px; line-height:1.25; }
  .cf-meta { color:#444; font-size:13px; margin-top:6px; }
  .cf-actions { display:flex; flex-direction:column; gap:8px; min-width:120px; }
  .cf-btn { padding:8px 10px; border-radius:8px; border:1px solid #d4af37; background:#fff; cursor:pointer; font-weight:600; }
  .cf-btn.primary { background:#e63946; color:#fff; border-color:transparent; }
  .cf-heading { font-size:18px; color:#000; margin:12px 0; font-weight:700; }
  .cf-small { font-size:13px; color:#666; }
  /* Popup */
  #bookingPopup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55);
                  align-items:center; justify-content:center; z-index:10000; padding:18px; box-sizing:border-box; }
  #bookingInner { width:100%; max-width:900px; /* Increased max-width for calendar */ background:linear-gradient(145deg,#fff8e7,#fff2cc); border-radius:12px; padding:20px;
                  position:relative; border:2px solid transparent; border-image:linear-gradient(90deg,#f9d423,#d4af37) 1; box-shadow:0 10px 40px rgba(0,0,0,0.12); }
  #bookingInner h2 { margin:0 0 12px 0; font-family:Poppins,sans-serif; color:#000; text-align:center; font-size:18px; }
  #bookingInner .close { position:absolute; right:14px; top:12px; cursor:pointer; font-size:20px; color:#444; }
  #cf-loading { color:#444; font-size:14px; margin-top:12px; }
  @media (max-width:640px) {
    .cf-card { flex-direction:column; }
    .cf-actions { flex-direction:row; justify-content:space-between; }
  }
</style>

        /* -------------------------
            Helpers & config
            ------------------------- */
        // IMPORTANT: Verify this is the correct GHL calendar URL
        const GHL_CALENDAR_BASE_URL = 'https://link.deliveringdemand.com/widget/bookings/wow-fusion-booking-calendar';
        const POSTCODES_API_BASE = 'https://api.postcodes.io';
        const resultsDiv = document.getElementById('clinicResults');
        const inputEl = document.getElementById('postcodeInput');
        const loadingEl = document.getElementById('cf-loading');
        const bookingPopup = document.getElementById('bookingPopup');
        const bookingCalendarIframe = document.getElementById('bookingCalendar');
        const clinicNameSpan = document.getElementById('clinicNameSpan');

        // Filter and map clinics. Only include those that have valid Lat/Lon.
        let clinicObjects = clinics
            .filter(c => {
                // A clinic is considered "geocoded" only if it has both lat and lon.
                if (c.lat && c.lon) {
                    return true;
                }
                // Log problem clinics to the console for easy debugging
                console.warn(`Clinic missing coordinates: ${c.name} (${c.postcode})`);
                return false;
            })
            .map(c => ({
                ...c,
                geocoded: true,
                distanceMiles: Infinity // Initialize distance
            }));

        // Haversine formula to calculate great-circle distance (in km)
        function haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in kilometers
            const toRad = deg => deg * Math.PI/180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Conversion from Kilometers to Miles
        function kmToMiles(km){
             return km * 0.621371;
        }

        /* Initialize: Now much simpler as data is pre-geocoded */
        async function initClinics() {
            loadingEl.style.display = 'none'; // No loading needed
            console.log('Clinics initialised:', clinicObjects.length, 'geocoded of', clinics.length);
        }
        initClinics();

        /* Utility: simple HTML escape */
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        /* -------------------------
            Popup / Booking Functions
            ------------------------- */

        // Opens the Calendar Widget
        function openBookingCalendar(clinic) {
            // 1. Set the dynamic header
            clinicNameSpan.textContent = escapeHtml(clinic.name);

            // 2. Construct the Calendar URL with pre-fill/source data
            const calendarUrl = `${GHL_CALENDAR_BASE_URL}?_clientEmail=${encodeURIComponent(clinic.email)}&_clientName=${encodeURIComponent(clinic.name)}&_source=ClinicFinder`;

            // 3. Set the iframe source to the Calendar widget
            bookingCalendarIframe.src = calendarUrl;

            // 4. Show the popup
            bookingPopup.style.display = 'flex';
        }

        // Closes the Calendar Widget
        function closeBookingCalendar() {
            bookingPopup.style.display = 'none';
            bookingCalendarIframe.src = ''; // Clear iframe to stop loading/video/audio
            clinicNameSpan.textContent = '';
        }


        /* -------------------------
            UI Generation & Search Logic
            ------------------------- */

        /* Utility: Generates HTML for a single clinic card */
        function generateClinicCard(clinic) {
            // FIX: Ensure distance is shown in miles, or 'Check Availability' if Infinity.
            const distanceText = clinic.distanceMiles !== Infinity ? `${clinic.distanceMiles.toFixed(1)} miles away` : 'Check Availability';

            // The 'Book Now' button calls openBookingCalendar
            // Note: clinic object is passed as a stringified JSON object
            return `
                <div class="cf-card">
                    <div class="cf-left">
                        <div class="cf-name">${escapeHtml(clinic.name)}</div>
                        <div class="cf-address">${escapeHtml(clinic.address)}</div>
                        <div class="cf-meta">${escapeHtml(clinic.phone)} | ${escapeHtml(clinic.email)}</div>
                    </div>
                    <div class="cf-actions">
                        <div class="cf-small">${distanceText}</div>
                        <button class="cf-btn primary" onclick='openBookingCalendar(${JSON.stringify(clinic)})'>
                            Book Now
                        </button>
                    </div>
                </div>
            `;
        }

        /* Renders the list of clinics */
        function renderResults(clinics) {
            resultsDiv.innerHTML = '';
            if (clinics.length === 0) {
                resultsDiv.innerHTML = '<p class="cf-heading">No clinics found nearby or matching your search.</p>';
                return;
            }

            // Sort by distance (Infinity distances will naturally appear at the end)
            clinics.sort((a, b) => a.distanceMiles - b.distanceMiles);

            resultsDiv.innerHTML = '<h2 class="cf-heading">Showing Results</h2>' + clinics.map(generateClinicCard).join('');
        }

        async function findUserLocation(input) {
            const query = input.trim();
            loadingEl.style.display = 'block';
            resultsDiv.innerHTML = '';

            // 1. Try to geocode the input as a full postcode or outcode using postcodes.io
            // Full postcode lookup (e.g., 'SW20 0RH')
            let response = await fetch(`${POSTCODES_API_BASE}/postcodes/${query}`);
            let data = await response.json();

            if (data.status === 200 && data.result) {
                processUserLocation(data.result.latitude, data.result.longitude);
                return;
            }

            // Outcode lookup (e.g., 'SW20') - uses the nearest outcode centroid
            response = await fetch(`${POSTCODES_API_BASE}/outcodes/${query}`);
            data = await response.json();

            if (data.status === 200 && data.result) {
                // Outcodes return an array of results; use the first one's lat/lon
                processUserLocation(data.result.latitude, data.result.longitude);
                return;
            }


            // 2. Fallback: Simple text search (for city or clinic name)
            const lowerQuery = query.toLowerCase();
            const filteredClinics = clinicObjects.filter(clinic =>
                clinic.name.toLowerCase().includes(lowerQuery) ||
                clinic.address.toLowerCase().includes(lowerQuery) ||
                clinic.postcode.toLowerCase().includes(lowerQuery) ||
                clinic.postcode.toLowerCase().startsWith(lowerQuery)
            );

            loadingEl.style.display = 'none';
            if (filteredClinics.length > 0) {
                // Found by name/city/text, but can't calculate distance
                filteredClinics.forEach(c => c.distanceMiles = Infinity);
                renderResults(filteredClinics);
            } else {
                resultsDiv.innerHTML = '<p class="cf-heading">No clinics found nearby or matching your search.</p>';
            }
        }

        function processUserLocation(userLat, userLon) {
            // 1. Calculate distance for all GEOCDODED clinics
            clinicObjects.forEach(clinic => {
                const km = haversineKm(userLat, userLon, clinic.lat, clinic.lon);
                // Convert KM result to MILES
                clinic.distanceMiles = kmToMiles(km);
            });

            // 2. Render the results (will automatically sort by distance)
            loadingEl.style.display = 'none';
            renderResults(clinicObjects);
        }

        // Debounce utility function (prevents API spam on fast typing)
        function debounce(func, delay) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), delay);
            };
        }

        // Event listener for the input field
        inputEl.addEventListener('input', debounce(() => {
            const query = inputEl.value.trim();
            if (query.length > 2) {
                findUserLocation(query);
            } else {
                // Clear results and reset distances when input is too short
                resultsDiv.innerHTML = '';
                clinicObjects.forEach(c => c.distanceMiles = Infinity);
            }
        }, 300));

    </script>
